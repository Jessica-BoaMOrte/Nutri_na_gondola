<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Receita | Nutrição na Gôndola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/legacy.css">
    <link rel="stylesheet" href="../css/receita.css">
</head>

<body data-perfil="aluno" data-page="receita">

    <div class="container">

        <!-- MENU LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-title">
                <h2>Portal do Aluno</h2>
            </div>
            <nav class="menu" aria-label="Menu do portal">
                <a href="dashboardaluno.html"><i class="fa-solid fa-house" aria-hidden="true"></i>Dashboard</a>
                <a href="informacoes.html" class="active"><i class="fa-solid fa-plus" aria-hidden="true"></i>Criar Informações</a>
                <a href="historico.html"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>Histórico</a>
                <a href="../login.html" data-sair><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>Sair</a>
            </nav>
        </aside>

        <!-- CONTEÚDO -->
        <main class="content">

            <header>
                <div>
                    <h1>Adicionar Receita</h1>
                    <p>Cadastre uma nova receita relacionada a um alimento.</p>
                </div>
            </header>

            <form class="formulario" data-form="receita">
                <div class="campo">
                    <label for="alimento">Alimento relacionado</label>
                    <input id="alimento" name="alimento" type="text" list="lista-alimentos" placeholder="Ex: Banana" required autocomplete="off">
                </div>
                <datalist id="lista-alimentos"></datalist>
                <div class="campo">
                    <label for="nome">Nome da Receita</label>
                    <input id="nome" name="nome" type="text" placeholder="Ex: Bolo de Banana" required>
                </div>
                <div class="campo">
                    <label for="ingredientes">Ingredientes</label>
                    <textarea id="ingredientes" name="ingredientes" rows="6" placeholder="Um ingrediente por linha" required></textarea>
                </div>
                <div class="campo">
                    <label for="preparo">Modo de Preparo</label>
                    <textarea id="preparo" name="preparo" rows="8" placeholder="Um passo por linha" required></textarea>
                </div>
                <div class="linha">
                    <div class="campo">
                        <label for="tempo">Tempo de Preparo</label>
                        <input id="tempo" name="tempo" type="text" placeholder="Ex: 40 minutos">
                    </div>
                    <div class="campo">
                        <label for="rendimento">Rendimento</label>
                        <input id="rendimento" name="rendimento" type="text" placeholder="Ex: 8 porções">
                    </div>
                </div>
                <button type="submit">Salvar Receita</button>
                <p id="form-msg" class="msg" role="status"></p>
            </form>

            <footer>
                © 2025 Faculdade de Ciências Médicas da Santa Casa de São Paulo.
                <br>
                Todos os direitos reservados.
            </footer>

        </main>

    </div>

    <script src="../js/api.js" defer></script>
    <script src="../js/painel.js" defer></script>
</body>

</html>
