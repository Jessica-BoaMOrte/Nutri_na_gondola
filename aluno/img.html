<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Imagem | Nutrição na Gôndola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/legacy.css">
    <link rel="stylesheet" href="../css/img.css">
</head>

<body data-perfil="aluno" data-page="img">

    <div class="container">

        <!-- MENU LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-title">
                <h2>Portal do Aluno</h2>
            </div>
            <nav class="menu" aria-label="Menu do portal">
                <a href="dashboardaluno.html"><i class="fa-solid fa-house" aria-hidden="true"></i>Dashboard</a>
                <a href="informacoes.html" class="active"><i class="fa-solid fa-plus" aria-hidden="true"></i>Criar Informações</a>
                <a href="historico.html"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>Histórico</a>
                <a href="../login.html" data-sair><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>Sair</a>
            </nav>
        </aside>

        <!-- CONTEÚDO -->
        <main class="content">

            <header>
                <div>
                    <h1>Adicionar Imagem</h1>
                    <p>Envie imagens relacionadas aos alimentos cadastrados.</p>
                </div>
            </header>

            <form class="formulario" data-form="imagem">
                <div class="campo">
                    <label for="alimento">Alimento relacionado</label>
                    <input id="alimento" name="alimento" type="text" list="lista-alimentos" placeholder="Ex: Banana" required autocomplete="off">
                </div>
                <datalist id="lista-alimentos"></datalist>
                <div class="campo">
                    <label for="arquivo">Selecionar Imagem</label>
                    <input id="arquivo" name="arquivo" type="file" accept="image/*" required>
                </div>
                <div class="preview">
                    <p>Pré-visualização da imagem</p>
                    <div class="preview-box" id="preview-box"><span>Imagem aparecerá aqui</span></div>
                </div>
                <div class="campo">
                    <label for="descricao">Descrição da Imagem</label>
                    <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva a imagem enviada"></textarea>
                </div>
                <button type="submit">Salvar Imagem</button>
                <p id="form-msg" class="msg" role="status"></p>
            </form>

            <footer>
                © 2025 Faculdade de Ciências Médicas da Santa Casa de São Paulo.
                <br>
                Todos os direitos reservados.
            </footer>

        </main>

    </div>

    <script src="../js/api.js" defer></script>
    <script src="../js/painel.js" defer></script>
</body>

</html>
